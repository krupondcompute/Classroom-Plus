<!DOCTYPE html>
<html lang="th" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom PLus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css" rel="stylesheet">
<style>
:root{
  --blue:#2563eb; --blue-dark:#1e3a8a; --blue-mid:#1d4ed8; --blue-light:#dbeafe; --sky:#e0f2fe; --cyan:#38bdf8;
  --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
  --bg:#f5f8ff; --surface:#ffffff; --surface-2:#f1f5fd; --text:#0f172a; --muted:#64748b; --border:#dbe3f3;
  --r-sm:16px; --r:22px; --r-lg:28px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(37,99,235,.08);
  --shadow-lg:0 2px 6px rgba(15,23,42,.06),0 22px 48px rgba(30,58,138,.16);
  --t:200ms cubic-bezier(.2,.8,.2,1);
  --side-w:264px; --head-h:68px; --dock-h:68px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
[data-theme=dark]{
  --bg:#0b1220; --surface:#111a2e; --surface-2:#16213a; --text:#e5edff; --muted:#94a3b8; --border:#24314f; --blue-light:#1e2b4f; --sky:#0f2a3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 22px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;min-height:100dvh;font-size:16px;-webkit-tap-highlight-color:transparent}
body.auth{background:#fff}
[data-theme=dark] body.auth{background:var(--bg)}
main{flex:1}
a{color:var(--blue)}
.btn,.form-control,.form-select{min-height:44px;border-radius:14px;font-size:16px}
.form-control,.form-select{background-color:var(--surface);color:var(--text);border-color:var(--border)}
.form-control:focus,.form-select:focus,.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid rgba(56,189,248,.55);outline-offset:2px;box-shadow:none;border-color:var(--blue)}
.btn{font-weight:600;transition:transform var(--t),box-shadow var(--t),background var(--t)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));border:0;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn-primary:hover{box-shadow:0 10px 22px rgba(37,99,235,.38)}
.btn-soft{background:var(--blue-light);color:var(--blue-mid);border:0}
[data-theme=dark] .btn-soft{color:#bfdbfe}
.btn-icon{width:44px;height:44px;display:inline-grid;place-items:center;padding:0;border-radius:50%}
.form-label{font-weight:600;font-size:.95rem}
.invalid-msg{color:var(--danger);font-size:.86rem;min-height:1.1em;margin-top:4px}
.is-invalid~.invalid-msg{display:block}
.text-muted{color:var(--muted)!important}
.hidden{display:none!important}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:rgba(15,23,42,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--t)}
#loader.show{opacity:1;pointer-events:auto}
.glass{width:min(280px,82vw);padding:28px 24px 22px;border-radius:28px;text-align:center;color:#fff;
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px rgba(30,58,138,.25),0 30px 70px rgba(15,23,42,.35)}
.ring{position:relative;width:112px;height:112px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,transparent 0 55%,#38bdf8 75%,#60a5fa 88%,#fff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 8px #38bdf8)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 30px rgba(56,189,248,.45);animation:pulse 2s ease-in-out infinite}
.logo-circle{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.logo-circle img,.logo-circle svg{width:72%;height:72%;object-fit:contain}
.pct{font-size:1.6rem;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 10px rgba(30,58,138,.5)}
.pbar{height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#fff);transition:width .2s}
.lmsg{font-size:.92rem;opacity:.95}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Auth ---------- */
.auth-wrap{flex:1;display:grid;place-items:center;padding:calc(24px + var(--sat)) 16px 24px}
.auth-card{width:min(1040px,100%);min-height:600px;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--blue);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-lg)}
.auth-left{position:relative;color:#fff;padding:40px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;
  background:linear-gradient(120deg,#1e3a8a,#2563eb,#0ea5e9,#1d4ed8,#312e81);background-size:400% 400%;animation:flow 14s ease infinite}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px}
.brand.custom{flex-direction:row;text-align:left}
.brand .logo-circle{width:120px;height:120px;flex:none;box-shadow:0 0 0 6px rgba(255,255,255,.25),0 12px 30px rgba(15,23,42,.3)}
.brand h1{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;margin:0;line-height:1.2;overflow-wrap:anywhere}
.welcome{font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:700;line-height:1.5;max-width:22ch}
.auth-right{padding:40px clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:center;color:var(--blue-dark)}
[data-theme=dark] .auth-right{color:#bfdbfe}
.auth-right h2{font-weight:800;margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:5px;margin-bottom:20px;position:relative}
.seg button{border:0;background:transparent;min-height:44px;border-radius:12px;font-weight:700;color:var(--muted);position:relative;z-index:1;transition:color var(--t)}
.seg button.active{color:#fff}
.seg .thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));transition:transform var(--t)}
.seg.right .thumb{transform:translateX(100%)}
.pw{position:relative}.pw .form-control{padding-right:52px}
.pw .eye{position:absolute;right:4px;top:0;border:0;background:none;color:var(--muted)}
.caps{color:var(--warn);font-size:.85rem}
.dob{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;text-align:center;font-size:.85rem;color:var(--muted)}
.steps div b{display:grid;place-items:center;margin:0 auto 4px;width:34px;height:34px;border-radius:50%;background:var(--surface-2);transition:background var(--t)}
.steps div.on b{background:var(--blue);color:#fff}.steps div.on{color:var(--blue);font-weight:700}
.summary{background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.strength{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}.strength i{display:block;height:100%;width:0;transition:width var(--t),background var(--t)}

/* ---------- Footer ---------- */
footer{background:#e0f2fe;color:#000;text-align:center;padding:14px 16px calc(14px + var(--sab));font-size:.92rem}
body.app footer{padding-bottom:calc(var(--dock-h) + 30px + var(--sab))}
@media (min-width:992px){body.app footer{margin-left:var(--side-w);transition:margin var(--t)} body.app.collapsed footer{margin-left:84px}}

/* ---------- App shell ---------- */
.sidebar{position:fixed;z-index:1040;top:0;bottom:0;left:0;width:var(--side-w);background:var(--surface);border-right:1px solid var(--border);
  padding:calc(14px + var(--sat)) 12px 16px calc(12px + var(--sal));display:flex;flex-direction:column;transition:transform var(--t),width var(--t);overflow:hidden}
.side-brand{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:18px;padding-left:4px;white-space:nowrap}
.side-brand .logo-circle{width:44px;height:44px;flex:none;border:2px solid var(--blue-light)}
.side-brand b{font-size:1.05rem;color:var(--blue-dark);overflow:hidden;text-overflow:ellipsis}
[data-theme=dark] .side-brand b{color:#bfdbfe}
.nav-side{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nav-side button{display:flex;align-items:center;gap:14px;min-height:46px;border:0;background:none;border-radius:14px;padding:0 14px;color:var(--muted);font-weight:600;white-space:nowrap;text-align:left;transition:background var(--t),color var(--t)}
.nav-side button i{width:22px;text-align:center;font-size:1.05rem}
.nav-side button:hover{background:var(--surface-2);color:var(--text)}
.nav-side button.active{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.nav-label{font-size:.75rem;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px;letter-spacing:.06em}
.side-toggle{position:fixed;z-index:1050;top:calc(var(--sat) + (var(--head-h) - 40px)/2);left:calc(var(--side-w) - 20px);width:40px;height:40px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.4);transition:left var(--t),transform var(--t)}
.app-main{transition:margin var(--t);min-width:0}
.topbar{position:sticky;top:0;z-index:1030;height:calc(var(--head-h) + var(--sat));padding:var(--sat) calc(16px + var(--sar)) 0 32px;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar .title{font-weight:800;font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-switch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 4px;border:0;min-height:44px;font-weight:600;color:var(--text);font-size:.9rem}
.mode-switch .knob{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;transition:background var(--t)}
.mode-switch.student .knob{background:var(--ok)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--blue-light);color:var(--blue);display:inline-grid;place-items:center;font-weight:800;flex:none}
.badge-dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
.page{padding:20px calc(16px + var(--sar)) 24px calc(16px + var(--sal));max-width:1280px;margin:0 auto;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{margin:12px 16px 0;border-radius:var(--r-sm);padding:12px 16px;background:#fef3c7;color:#78350f;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (min-width:992px){
  .app-main{margin-left:var(--side-w)}
  body.collapsed .sidebar{width:84px}
  body.collapsed .app-main{margin-left:84px}
  body.collapsed .side-toggle{left:64px;transform:rotate(180deg)}
  body.collapsed .nav-side span,body.collapsed .side-brand b,body.collapsed .nav-label{opacity:0}
}
@media (max-width:991.98px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  body.side-open .sidebar{transform:none}
  .side-toggle{left:calc(10px + var(--sal))}
  body.side-open .side-toggle{left:calc(var(--side-w) - 20px)}
  .topbar{padding-left:62px}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:1035;opacity:0;pointer-events:none;transition:opacity var(--t)}
  body.side-open .scrim{opacity:1;pointer-events:auto}
}
.dock{position:fixed;z-index:1030;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));display:flex;gap:4px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:var(--shadow-lg);width:max-content;max-width:calc(100% - 20px)}
.dock button{border:0;background:none;min-width:64px;min-height:54px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);transition:all var(--t)}
.dock button i{font-size:1.15rem}
.dock button.active{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.35)}
@media (min-width:992px){.dock{left:calc(50% + var(--side-w)/2)} body.collapsed .dock{left:calc(50% + 42px)} .dock button{min-width:84px;font-size:.8rem}}
@media (max-width:420px){.dock button{min-width:56px;font-size:.66rem}}
.fab{position:fixed;z-index:1031;right:calc(18px + var(--sar));bottom:calc(var(--dock-h) + 30px + var(--sab));width:58px;height:58px;border-radius:50%;border:0;color:#fff;font-size:1.3rem;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));box-shadow:0 10px 24px rgba(37,99,235,.45);transition:transform var(--t)}
.fab:hover{transform:translateY(-2px) scale(1.04)}

/* ---------- Components ---------- */
.card-x{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;transition:transform var(--t),box-shadow var(--t)}
.card-x.hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);cursor:pointer}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h3{margin:0;font-weight:800;flex:1;min-width:200px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--blue-light);color:var(--blue)}
.stat b{font-size:1.6rem;display:block;line-height:1.1}
.stat small{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.cover{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,#60a5fa,#1e3a8a);display:grid;place-items:center;color:#fff;font-size:2rem;overflow:hidden;margin-bottom:12px}
.cover img{width:100%;height:100%;object-fit:cover}
.progress{height:8px;border-radius:8px;background:var(--surface-2)}
.progress-bar{background:linear-gradient(90deg,var(--cyan),var(--blue))}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:#dcfce7;color:#166534}.chip.warn{background:#fef3c7;color:#92400e}.chip.danger{background:#fee2e2;color:#991b1b}.chip.info{background:var(--blue-light);color:var(--blue-mid)}
.table-x{width:100%;border-collapse:separate;border-spacing:0;border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.table-x thead th{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-weight:700;padding:12px 14px;white-space:nowrap}
.table-x td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-x tbody tr:nth-child(even){background:var(--surface-2)}
.table-x tbody tr{transition:background var(--t)}.table-x tbody tr:hover{background:var(--blue-light)}
@media (max-width:767.98px){
  .table-x thead{display:none}
  .table-x,.table-x tbody,.table-x tr,.table-x td{display:block;width:100%}
  .table-x{background:none}
  .table-x tr{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:12px;padding:8px 4px;box-shadow:var(--shadow)}
  .table-x td{border:0;display:flex;justify-content:space-between;gap:12px;padding:6px 12px;text-align:right}
  .table-x td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left}
}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;min-height:120px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty i{font-size:3rem;color:var(--blue);opacity:.5;margin-bottom:12px;display:block}
.drop{border:2px dashed var(--border);border-radius:var(--r-sm);padding:22px;text-align:center;color:var(--muted);transition:all var(--t);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);margin-top:8px}
.file-row a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000}
.video iframe,.video video,.video>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.lesson-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;transition:background var(--t)}
.lesson-item:hover{background:var(--surface-2)}
.lesson-item .num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blue-light);color:var(--blue);font-weight:800;flex:none}
.lesson-item.done .num{background:#dcfce7;color:var(--ok)}
.pin{color:var(--warn)}
.modal-content{border-radius:var(--r);border:0;background:var(--surface);color:var(--text)}
.toast-wrap{position:fixed;z-index:3100;top:calc(12px + var(--sat));right:12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 24px)}
.toast-x{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);border-left:5px solid var(--blue);animation:fadeUp .2s ease;min-width:240px}
.toast-x.success{border-color:var(--ok)}.toast-x.error{border-color:var(--danger)}.toast-x.warning{border-color:var(--warn)}
.notif{max-height:60vh;overflow:auto}
.notif div{padding:10px 12px;border-radius:12px;cursor:pointer}.notif div:hover{background:var(--surface-2)}.notif .unread{background:var(--blue-light)}
.dropdown-menu{border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:8px;background:var(--surface)}
.dropdown-item{border-radius:12px;min-height:42px;display:flex;align-items:center;gap:10px;color:var(--text)}
.swal2-popup{border-radius:24px!important;font-family:'Sarabun',sans-serif!important}
.flatpickr-calendar{font-family:'Sarabun',sans-serif}
.nav-pills .nav-link{border-radius:14px;min-height:44px;font-weight:600}
.nav-pills .nav-link.active{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
#appView{flex:1}
.invalid-msg:empty{min-height:0;margin:0}
[data-theme=dark] .banner{background:#422006;color:#fde68a}
[data-theme=dark] .chip.ok{background:#14532d;color:#bbf7d0}[data-theme=dark] .chip.warn{background:#451a03;color:#fde68a}[data-theme=dark] .chip.danger{background:#450a0a;color:#fecaca}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;font-family:'Sarabun'}#printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border:1px solid #999;padding:4px 6px;font-size:12px}}

<script>
/* ===== ตั้งค่า: วาง URL เว็บแอปของ Apps Script (ลงท้าย /exec) ระหว่างเครื่องหมาย ' ' ===== */

<script>
'use strict';
/* =========================================================
 * Classroom PLus — Frontend (SPA)
 * ========================================================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

};
const DEFAULT_LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs>
<path d="M32 6l26 14H6z" fill="url(#lg)"/><rect x="9" y="22" width="46" height="5" rx="1.5" fill="#1e3a8a"/>
<g fill="#2563eb"><rect x="12" y="29" width="6" height="20" rx="1"/><rect x="23" y="29" width="6" height="20" rx="1"/><rect x="35" y="29" width="6" height="20" rx="1"/><rect x="46" y="29" width="6" height="20" rx="1"/></g>
<rect x="6" y="50" width="52" height="7" rx="2" fill="url(#lg)"/><circle cx="32" cy="15" r="3.2" fill="#fff"/></svg>`;

/* ---------------- Loader (นับ reference, แสดงอย่างน้อย 400ms) ---------------- */
const Loader = {
  n: 0, p: 0, real: false, t: null, at: 0, hideT: null,
  el: () => $('#loader'),
  show(msg) {
    this.n++;
    $('#lMsg').textContent = msg || 'กำลังโหลดข้อมูล...';
    if (this.n === 1) {
      clearTimeout(this.hideT); this.at = Date.now(); this.p = 0; this.real = false; this.render();
      this.el().classList.add('show');
      clearInterval(this.t);
      this.t = setInterval(() => { if (!this.real && this.p < 90) { this.p += (90 - this.p) * 0.07 + 0.3; this.render(); } }, 120);
    }
  },
  set(percent, msg) { this.real = true; this.p = Math.max(0, Math.min(100, percent)); if (msg) $('#lMsg').textContent = msg; this.render(); },
  render() { const v = Math.round(this.p); $('#lPct').textContent = v + '%'; $('#lBar').style.width = v + '%'; },
  hide() {
    this.n = Math.max(0, this.n - 1);
    if (this.n) return;
    this.p = 100; this.render(); clearInterval(this.t);
    const wait = Math.max(0, 400 - (Date.now() - this.at)) + 180;

  }
};

/* ---------------- Toast / Confirm ---------------- */
function toast(msg, type = 'success') {

  const d = document.createElement('div');
  d.className = 'toast-x ' + type; d.setAttribute('role', 'status');
  d.innerHTML = `<i class="fa-solid ${icon} fa-lg"></i><div>${esc(msg)}</div>`;
  $('#toasts').appendChild(d);

}
async function confirmBox({ title, html, danger = false, confirmText = 'ยืนยัน', icon }) {
  const r = await Swal.fire({ title, html, icon: icon || (danger ? 'warning' : 'question'), showCancelButton: true, reverseButtons: true, focusCancel: danger,
    confirmButtonText: confirmText, cancelButtonText: 'ยกเลิก', confirmButtonColor: danger ? '#dc2626' : '#2563eb', cancelButtonColor: '#64748b' });

}
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.message) { toast(e.reason.message, 'error'); e.preventDefault(); } });

/* ---------------- API: ห่อ google.script.run เป็น Promise ---------------- */
/* ทำงานได้ 2 แบบ: (1) เปิดผ่าน Apps Script /exec ใช้ google.script.run  (2) เปิดผ่าน GitHub Pages ใช้ fetch ไปที่ CP_API_URL */
const HAS_GAS = !!(window.google && google.script && google.script.run);

      return fetch(API_URL(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, token: S.token, args }), redirect: 'follow', credentials: 'omit' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

        .catch(e => rej(e.code ? e : Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือ URL ของ Apps Script'), { code: 'NET' })));
    }

      .withSuccessHandler(r => r && r.ok ? res(r.data) : rej(Object.assign(new Error(r ? r.error : 'ไม่ได้รับการตอบกลับจากเซิร์ฟเวอร์'), { code: r && r.code })))
      .withFailureHandler(e => rej(Object.assign(new Error(/network|NetworkError|timed? ?out/i.test(String(e && e.message)) ? 'การเชื่อมต่อขัดข้อง กรุณาตรวจสอบอินเทอร์เน็ต' : 'เกิดข้อผิดพลาดที่เซิร์ฟเวอร์: ' + (e && e.message || e)), { code: 'NET' })))
      .rpc(fn, S.token, args);
  });

  if (o.loader !== false) Loader.show(o.msg);
  return attempt(o.retry ?? 1)
    .catch(e => { if (e.code === 'AUTH' && S.token) { localLogout(); toast(e.message, 'warning'); } throw e; })
    .finally(() => { if (o.loader !== false) Loader.hide(); });
}
const api = (fn, ...a) => call(fn, a);
const apiQ = (fn, ...a) => call(fn, a, { loader: false });
const apiMsg = (msg, fn, ...a) => call(fn, a, { msg });

/* ---------------- Utils ---------------- */

  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) + (time ? ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : '');
}
const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.ceil(b / 1024) + ' KB';
const initials = n => esc(String(n || '?').trim().charAt(0));

/* ---------------- ฟอร์มกลาง ---------------- */
function opt(list, v) { return list.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v ?? '') ? 'selected' : ''}>${esc(lab)}</option>`; }).join(''); }
function fieldHtml(f, v) {

    case 'textarea': input = `<textarea class="form-control" id="${id}" name="${f.k}" rows="${f.rows || 4}">${esc(v)}</textarea>`; break;
    case 'select': input = `<select class="form-select" id="${id}" name="${f.k}">${opt(typeof f.opts === 'function' ? f.opts() : f.opts, v)}</select>`; break;
    case 'check': return `<div class="mb-3 ${f.col || ''}"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="${id}" name="${f.k}" ${String(v) === 'true' ? 'checked' : ''}><label class="form-check-label" for="${id}">${f.label}</label></div>${f.help ? `<div class="form-text">${f.help}</div>` : ''}</div>`;

    case 'files': input = `<div class="drop" data-drop="${f.k}" tabindex="0" role="button" aria-label="อัปโหลดไฟล์"><i class="fa-solid fa-cloud-arrow-up fa-xl mb-2 d-block"></i>ลากไฟล์มาวาง หรือแตะเพื่อเลือก<br><small>ไม่เกิน ${S.maxMB} MB ต่อไฟล์ (ไฟล์ใหญ่กว่านี้ให้แนบเป็นลิงก์ Google Drive)</small><input type="file" multiple class="hidden"></div><div data-files="${f.k}"></div><input type="hidden" name="${f.k}" value="${esc(JSON.stringify(J(v)))}">`; break;

    case 'video': input = `<div class="input-group"><input class="form-control" id="${id}" name="${f.k}" value="${esc(v)}" placeholder="ลิงก์ YouTube / Vimeo / Google Drive / ไฟล์ .mp4"><button type="button" class="btn btn-soft" data-upvideo="${f.k}"><i class="fa-solid fa-upload"></i> อัปโหลด</button><input type="file" accept="video/*" class="hidden"></div>`; break;
    case 'datetime': case 'date': input = `<input class="form-control" data-fp="${f.type}" id="${id}" name="${f.k}" value="${esc(v)}" placeholder="แตะเพื่อเลือก${f.type === 'date' ? 'วันที่' : 'วันและเวลา'}">`; break;

}
const formHtml = (fields, data = {}) => `<div class="row">${fields.map(f => fieldHtml(Object.assign({ col: 'col-12' }, f), data[f.k])).join('')}</div>`;
function readForm(root, fields) {
  const o = {};
  fields.forEach(f => {
    const el = root.querySelector(`[name="${f.k}"]`);
    if (!el) return;
    if (f.type === 'dob') { el.value = readDob('f_' + f.k); }
    if (f.type === 'check') o[f.k] = el.checked ? 'true' : 'false';
    else if (f.type === 'files') o[f.k] = J(el.value);
    else if (f.type === 'links') o[f.k] = el.value.split('\n').map(l => l.split('|')).filter(p => p.length >= 2).map(p => ({ name: p[0].trim(), url: p.slice(1).join('|').trim() }));

    if (f.req && !String(Array.isArray(o[f.k]) ? o[f.k].length || '' : o[f.k] ?? '').trim()) m = 'กรุณากรอก' + f.label.replace(/<[^>]+>/g, '');

function parseVideo(u) {
  u = String(u || '').trim(); let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/))) return { type: 'youtube', id: m[1] };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { type: 'vimeo', id: m[1] };
  if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/))) return { type: 'drive', id: m[1] };
  if (/^https?:\/\/.+\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)) return { type: 'file', url: u };
  return null;
}
let YTP = null;
const loadYT = () => YTP || (YTP = new Promise((res, rej) => {
  if (window.YT && YT.Player) return res();
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = rej; document.head.appendChild(s);
  setTimeout(() => rej(new Error('yt timeout')), 7000);
}));
function mountVideo(box, url, prog, lessonId) {
  const v = parseVideo(url), pos = Number(prog && prog.videoPos) || 0;
  if (!v) { box.innerHTML = `<a class="btn btn-primary" href="${safeUrl(url)}" target="_blank" rel="noopener"><i class="fa-solid fa-play"></i> เปิดวิดีโอ</a>`; return; }
  let last = pos, done = prog && prog.videoDone === 'true';
  const save = (p, isDone) => { if (isDone && !done) { done = true; apiQ('saveProgress', lessonId, { videoPos: p, videoDone: true }).then(() => toast('บันทึก: ดูวิดีโอครบแล้ว')); } else if (Math.abs(p - last) >= 5) { last = p; apiQ('saveProgress', lessonId, { videoPos: p }).catch(() => {}); } };
  const speedSel = `<select class="form-select form-select-sm w-auto" id="vSpeed" aria-label="ความเร็ว">${[0.5, 0.75, 1, 1.25, 1.5, 2].map(s => `<option value="${s}" ${s === 1 ? 'selected' : ''}>${s}x</option>`).join('')}</select>`;
  const tools = (manual) => `<div class="d-flex flex-wrap gap-2 align-items-center mt-2">${manual ? '' : `<label class="small text-muted" for="vSpeed">ความเร็ว</label>${speedSel}`}
    ${pos > 5 ? `<span class="chip info"><i class="fa-solid fa-clock-rotate-left"></i> เล่นต่อจาก ${Math.floor(pos / 60)}:${String(pos % 60).padStart(2, '0')}</span>` : ''}
    <button class="btn btn-sm btn-soft ms-auto" id="vDone" ${done ? 'disabled' : ''}><i class="fa-solid fa-circle-check"></i> ${done ? 'ดูครบแล้ว' : 'ทำเครื่องหมายว่าดูครบ'}</button></div>`;
  if (v.type === 'youtube') {
    box.innerHTML = `<div class="video"><div id="ytp"></div></div>` + tools(false);
    loadYT().then(() => {
      const pl = new YT.Player('ytp', { videoId: v.id, playerVars: { start: pos, rel: 0, playsinline: 1, modestbranding: 1 }, events: {
        onStateChange: e => { if (e.data === 0) save(Math.floor(pl.getDuration()), true); } } });
      S.timers.push(setInterval(() => { try { if (pl.getPlayerState() === 1) save(Math.floor(pl.getCurrentTime())); } catch (e) {} }, 10000));
      S.onLeave.push(() => { try { save(Math.floor(pl.getCurrentTime())); } catch (e) {} });
      $('#vSpeed').onchange = () => pl.setPlaybackRate(+$('#vSpeed').value);
    }).catch(() => { $('#ytp').outerHTML = `<iframe src="https://www.youtube.com/embed/${v.id}?start=${pos}&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="วิดีโอ"></iframe>`; });
  } else if (v.type === 'file') {
    box.innerHTML = `<div class="video"><video controls playsinline preload="metadata" src="${safeUrl(v.url)}"></video></div>` + tools(false);
    const vid = $('video', box);
    vid.addEventListener('loadedmetadata', () => { if (pos && pos < vid.duration - 3) vid.currentTime = pos; });
    vid.addEventListener('timeupdate', () => save(Math.floor(vid.currentTime)));
    vid.addEventListener('ended', () => save(Math.floor(vid.duration), true));
    $('#vSpeed').onchange = () => vid.playbackRate = +$('#vSpeed').value;
  } else {
    const src = v.type === 'vimeo' ? `https://player.vimeo.com/video/${v.id}#t=${pos}s` : `https://drive.google.com/file/d/${v.id}/preview`;
    box.innerHTML = `<div class="video"><iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="วิดีโอ"></iframe></div>` + tools(true);
  }
  $('#vDone').onclick = () => { save(last, true); $('#vDone').disabled = true; $('#vDone').innerHTML = '<i class="fa-solid fa-circle-check"></i> ดูครบแล้ว'; };
}

async function crudForm(entity, row = {}, after) {
  await lists();

  const m = modal((isNew ? 'เพิ่ม' : 'แก้ไข') + LABEL[entity], formHtml(F, row), `<button class="btn btn-soft" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary" id="crudSave"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>`);
  bindForm(m.body, F);
  $('#crudSave').onclick = async () => {
    const d = validate(m.body, F);
    if (!d) return toast('กรุณาตรวจสอบข้อมูลที่ไม่ถูกต้อง', 'warning');
    if (!await confirmBox({ title: (isNew ? 'ยืนยันการเพิ่ม' : 'ยืนยันการแก้ไข') + LABEL[entity], html: `<b>${esc(nameOf(entity, d))}</b>` + (isNew && ['Lessons', 'Assignments', 'Announcements'].includes(entity) ? '<br><small class="text-muted">ระบบจะแจ้งเตือนนักเรียนที่เกี่ยวข้อง</small>' : '') })) return;
    if (row.id) d.id = row.id;

}

function exportXlsx(name, headers, rows) { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers].concat(rows)), 'Report'); XLSX.writeFile(wb, name + '.xlsx'); toast('ส่งออกไฟล์ Excel แล้ว'); }

      B.innerHTML = `<input class="form-control mb-3" type="search" placeholder="ค้นหาใน log..." id="aq" aria-label="ค้นหา log"><div id="at"></div><div class="d-flex justify-content-center gap-2 mt-3" id="ap"></div>`;
      const load = async () => { const r = await apiQ('auditLog', { page, q }); $('#at').innerHTML = tableHtml(['เวลา', 'ผู้ใช้', 'กิจกรรม', 'รายละเอียด'], r.rows.map(l => [thDate(l.at, true), esc(l.user), `<span class="chip">${esc(l.action)}</span>`, `<small>${esc(l.detail)}</small>`]));
        $('#ap').innerHTML = `<button class="btn btn-soft" ${page > 1 ? '' : 'disabled'} id="apPrev">ก่อนหน้า</button><span class="align-self-center">หน้า ${r.page}/${r.pages || 1} (${r.total})</span><button class="btn btn-soft" ${page < r.pages ? '' : 'disabled'} id="apNext">ถัดไป</button>`;
        $('#apPrev').onclick = () => { page--; load(); }; $('#apNext').onclick = () => { page++; load(); }; };
      $('#aq').addEventListener('input', debounce(() => { q = $('#aq').value; page = 1; load(); }, 300)); load();
    }
  };
  $$('[data-st]').forEach(b => b.onclick = () => { tab = b.dataset.st; draw(); });
  draw();
} };

/* =========================================================
 * เริ่มต้นระบบ
 * ========================================================= */
async function askApiUrl(msg) {
  const r = await Swal.fire({ title: 'เชื่อมต่อระบบ', icon: 'info', html: (msg ? `<div class="text-danger small mb-2">${esc(msg)}</div>` : '') + 'วาง URL เว็บแอปของ Google Apps Script (ลงท้าย <code>/exec</code>)<br><small class="text-muted">ผู้ดูแลควรใส่ไว้ใน docs/index.html เพื่อให้ทุกคนใช้ได้ทันที</small>',
    input: 'url', inputPlaceholder: 'https://script.google.com/macros/s/.../exec', confirmButtonText: 'เชื่อมต่อ', allowOutsideClick: false,
    inputValidator: v => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(v).trim()) ? null : 'URL ต้องอยู่ในรูปแบบ https://script.google.com/macros/s/.../exec' });
  store.set('cp_api', r.value.trim()); location.reload();
}
(async function init() {
  Loader.show('กำลังเตรียมระบบ...');
  if (!HAS_GAS && !API_URL()) { Loader.hide(); applyBrand(); renderLogin(); return askApiUrl(); }
  try {
    const b = await apiQ('bootstrap');
    S.config = b.config; S.classes = b.classes; S.maxMB = b.maxUploadMB; applyBrand();
    const token = store.get('cp_token'), exp = +store.get('cp_exp');
    if (token && (!exp || exp > Date.now())) {
      S.token = token; S.expiresAt = exp;
      try { const me = await apiQ('me'); S.user = me.user; S.config = me.config; S.classes = me.classes; enterApp(); return; } catch (e) { store.del('cp_token'); S.token = null; }
    }
    renderLogin();
  } catch (e) {
    applyBrand(); renderLogin();
    if (!HAS_GAS && !window.CP_API_URL) return askApiUrl(e.message);
    Swal.fire({ icon: 'error', title: 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ', html: esc(e.message) + '<br><small>ตรวจสอบว่าบัญชีที่ Deploy มีสิทธิ์แก้ไข Google Sheet และ Drive ที่กำหนดไว้</small>' });
  } finally { Loader.hide(); }
})();
</script>
