<!DOCTYPE html>
<html lang="th" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom +</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css" rel="stylesheet">
<style>
:root{
  --blue:#2563eb; --blue-dark:#1e3a8a; --blue-mid:#1d4ed8; --c1:#1e3a8a; --c2:#2563eb; --c3:#0ea5e9; --blue-light:#dbeafe; --sky:#e0f2fe; --cyan:#38bdf8;
  --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
  --bg:#f5f8ff; --surface:#ffffff; --surface-2:#f1f5fd; --text:#0f172a; --muted:#64748b; --border:#dbe3f3;
  --r-sm:16px; --r:22px; --r-lg:28px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(37,99,235,.08);
  --shadow-lg:0 2px 6px rgba(15,23,42,.06),0 22px 48px rgba(30,58,138,.16);
  --t:200ms cubic-bezier(.2,.8,.2,1);
  --side-w:264px; --head-h:68px; --dock-h:68px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
[data-theme=dark]{
  --bg:#0b1220; --surface:#111a2e; --surface-2:#16213a; --text:#e5edff; --muted:#94a3b8; --border:#24314f; --blue-light:#1e2b4f; --sky:#0f2a3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 22px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
h1,h2,h3,h4,h5,h6{line-height:1.45}
.text-truncate,.title,.side-brand b,.side-user .meta b,.file-row a{line-height:1.65!important;padding-block:.05em}
.btn{line-height:1.45}.form-control,.form-select{line-height:1.6}
.chip{line-height:1.6}
body{line-height:1.6;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;min-height:100dvh;font-size:16px;-webkit-tap-highlight-color:transparent}
body.auth{background:#fff}
[data-theme=dark] body.auth{background:var(--bg)}
main{flex:1}
body>*{flex-shrink:0}footer{flex-shrink:0}
a{color:var(--blue)}
.btn,.form-control,.form-select{min-height:44px;border-radius:14px;font-size:16px}
.form-control,.form-select{background-color:var(--surface);color:var(--text);border-color:var(--border)}
.form-control:focus,.form-select:focus,.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid rgba(56,189,248,.55);outline-offset:2px;box-shadow:none;border-color:var(--blue)}
.btn{font-weight:600;transition:transform var(--t),box-shadow var(--t),background var(--t)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-dark));border:0;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn-primary:hover{box-shadow:0 10px 22px rgba(37,99,235,.38)}
.btn-soft{background:var(--blue-light);color:var(--blue-mid);border:0}
[data-theme=dark] .btn-soft{color:#bfdbfe}
.btn-icon{width:44px;height:44px;display:inline-grid;place-items:center;padding:0;border-radius:50%}
.form-label{font-weight:600;font-size:.95rem}
.invalid-msg{color:var(--danger);font-size:.86rem;min-height:1.1em;margin-top:4px}
.is-invalid~.invalid-msg{display:block}
.text-muted{color:var(--muted)!important}
.hidden{display:none!important}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:rgba(15,23,42,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--t)}
#loader.show{opacity:1;pointer-events:auto}
.glass{width:min(280px,82vw);padding:28px 24px 22px;border-radius:28px;text-align:center;color:#fff;
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px rgba(30,58,138,.25),0 30px 70px rgba(15,23,42,.35)}
.ring{position:relative;width:112px;height:112px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,transparent 0 55%,var(--c3) 75%,var(--blue) 88%,#fff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 8px #38bdf8)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 30px rgba(56,189,248,.45);animation:pulse 2s ease-in-out infinite}
.logo-circle{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.logo-circle img,.logo-circle svg{width:72%;height:72%;object-fit:contain}
.pct{font-size:1.6rem;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 10px rgba(30,58,138,.5)}
.pbar{height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),#fff);transition:width .2s}
.lmsg{font-size:.92rem;opacity:.95}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Auth ---------- */
.auth-wrap{flex:1;display:grid;place-items:center;padding:calc(24px + var(--sat)) 16px 24px}
.auth-card{width:min(1040px,100%);min-height:600px;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--blue);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-lg)}
.auth-left{position:relative;color:#fff;padding:48px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 50% 115%,color-mix(in srgb,var(--c3) 75%,transparent) 0%,transparent 58%),linear-gradient(165deg,#040a24 0%,var(--c1) 48%,var(--c2) 100%)}
.auth-left>.brand,.auth-left>.welcome{position:relative;z-index:3}
.fx-net{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.75;pointer-events:none}
.fx-grid{position:absolute;left:-60%;right:-60%;bottom:-6%;height:58%;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(125,211,252,.42) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.42) 1px,transparent 1px);background-size:46px 46px;
  transform:perspective(300px) rotateX(64deg);transform-origin:center top;animation:gridMove 2.2s linear infinite;
  -webkit-mask-image:linear-gradient(to top,#000 15%,transparent 92%);mask-image:linear-gradient(to top,#000 15%,transparent 92%)}
@keyframes gridMove{to{background-position:0 46px}}
.bokeh{position:absolute;border-radius:50%;z-index:1;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),var(--bk,#7dd3fc) 38%,transparent 70%);filter:blur(var(--bl,2px));animation:bokeh var(--d,5s) ease-in-out infinite}
@keyframes bokeh{0%,100%{opacity:0;transform:scale(.55)}45%,55%{opacity:var(--o,.75);transform:scale(1)}}
.logo-wrap{position:relative;width:124px;height:124px;flex:none;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.logo-wrap .logo-circle{width:100%;height:100%;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 0 40px color-mix(in srgb,var(--c3) 70%,transparent),0 14px 30px rgba(2,6,23,.45)}
.orbit{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(125,211,252,.35);border-top-color:#fff;border-left-color:var(--c3);animation:spin 5s linear infinite}
.orbit.r2{inset:-28px;border-width:1px;border-color:rgba(255,255,255,.14);border-right-color:#c4b5fd;animation-duration:11s;animation-direction:reverse}
.orbit::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #7dd3fc,0 0 24px var(--c3)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
.brand-name{font-weight:900;letter-spacing:.5px;color:#fff;text-shadow:0 1px 0 #cfe3ff,0 2px 0 #9cc2f5,0 3px 0 #6b97d8,0 4px 0 #3f6fb8,0 10px 22px rgba(2,6,23,.55),0 0 28px color-mix(in srgb,var(--c3) 70%,transparent);animation:rise .9s .25s both}
.plus{position:relative;display:inline-block;font-size:.6em;font-weight:900;line-height:1;vertical-align:super;margin-left:.08em;top:-.12em;isolation:isolate;
  color:#fff;background:linear-gradient(180deg,#fff 15%,#bae6fd 55%,var(--c3) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(15,23,42,.35)) drop-shadow(0 0 5px color-mix(in srgb,var(--c3) 90%,transparent))}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:48%;pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:-1}
.plus::before{width:1.9em;height:1.9em;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,rgba(224,242,254,.9) 22%,color-mix(in srgb,var(--c3) 55%,transparent) 42%,transparent 70%);animation:flashCore 3.2s ease-out infinite}
.plus::after{width:2.5em;height:2.5em;background:radial-gradient(circle,#fff 0 18%,#e0f2fe 35%,var(--c3) 70%);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:flashStar 3.2s ease-out infinite}
@keyframes flashCore{0%,58%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}64%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}82%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes flashStar{0%,60%,100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-40deg)}67%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(10deg)}74%{opacity:.85;transform:translate(-50%,-50%) scale(.75) rotate(35deg)}86%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(70deg)}}
.welcome{font-size:clamp(1.9rem,3.6vw,2.9rem);font-weight:800;line-height:1.55;max-width:none;text-shadow:0 4px 18px rgba(2,6,23,.5);animation:glowTxt 4s 2s ease-in-out infinite}
.welcome{width:100%}
.welcome .ln{transform-origin:center;animation:breathe 6s 2.2s ease-in-out infinite}
.welcome .ln+.ln{animation-delay:3.2s}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.18) drop-shadow(0 0 14px color-mix(in srgb,var(--c3) 70%,transparent))}}
.welcome .ln{display:block;white-space:nowrap}
.welcome .w{display:inline-block;padding-block:.08em;opacity:0;animation:wordIn .7s cubic-bezier(.2,.9,.3,1.2) forwards}
.welcome .w.hl{background:linear-gradient(90deg,#fff,#7dd3fc,#c4b5fd,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wordIn .7s cubic-bezier(.2,.9,.3,1.2) forwards,shine 4s 1.5s linear infinite}
@keyframes wordIn{from{opacity:0;transform:translateY(26px) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes glowTxt{50%{text-shadow:0 4px 18px rgba(2,6,23,.5),0 0 26px color-mix(in srgb,var(--c3) 75%,transparent)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px}
.brand.custom{flex-direction:row;text-align:left;gap:40px}
.brand{gap:30px}
.brand h1{font-size:clamp(1.9rem,3.8vw,2.8rem);margin:0;line-height:1.2;overflow-wrap:anywhere}
.auth-right{padding:40px clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:center;color:var(--blue-dark)}
[data-theme=dark] .auth-right{color:#bfdbfe}
.auth-right h2{font-weight:800;margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:5px;margin-bottom:20px;position:relative}
.seg button{border:0;background:transparent;min-height:44px;border-radius:12px;font-weight:700;color:var(--muted);position:relative;z-index:1;transition:color .3s ease .05s}
.seg button.active{color:#fff}
.seg .thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));transition:transform .42s cubic-bezier(.34,1.45,.5,1);box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent)}
#loginForm,.login-links{animation:fadeUp .35s ease}
.seg.right .thumb{transform:translateX(100%)}
.pw{position:relative}.pw .form-control{padding-right:52px}
.pw .eye{position:absolute;right:4px;top:0;border:0;background:none;color:var(--muted)}
.caps{color:var(--warn);font-size:.85rem}
.dob{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps div{flex:1;text-align:center;font-size:.85rem;color:var(--muted)}
.steps div b{display:grid;place-items:center;margin:0 auto 4px;width:34px;height:34px;border-radius:50%;background:var(--surface-2);transition:background var(--t)}
.steps div.on b{background:var(--blue);color:#fff}.steps div.on{color:var(--blue);font-weight:700}
.summary{background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.strength{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}.strength i{display:block;height:100%;width:0;transition:width var(--t),background var(--t)}

/* ---------- Footer ---------- */
footer{background:#e0f2fe;color:#000;text-align:center;padding:14px calc(16px + var(--sar)) calc(14px + var(--sab)) calc(16px + var(--sal));font-size:.9rem}
body.app footer{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:.84rem;line-height:1.45;
  min-height:calc(var(--dock-h) + 24px + var(--sab));padding:8px calc(22px + var(--sar)) calc(8px + var(--sab)) 16px}
body.app footer .fsep{display:none}
@media (max-width:1499.98px){body.app footer{min-height:0;justify-content:flex-start;padding-top:14px;padding-bottom:calc(var(--dock-h) + 30px + var(--sab));padding-right:calc(92px + var(--sar))}}
@media (max-width:767.98px){body.app footer{align-items:center;text-align:center;font-size:.76rem;padding-left:16px;padding-right:16px}body.app footer span{max-width:calc(100vw - 150px)}}
@media (min-width:992px){body.app footer{margin-left:var(--side-w);transition:margin var(--t)} body.app.collapsed footer{margin-left:84px}}

/* ---------- App shell ---------- */
.sidebar{position:fixed;z-index:1040;top:0;bottom:0;left:0;width:var(--side-w);background:var(--surface);border-right:1px solid var(--border);
  padding:calc(14px + var(--sat)) 12px 16px calc(12px + var(--sal));display:flex;flex-direction:column;transition:transform var(--t),width var(--t);overflow:hidden}
.side-brand{display:flex;align-items:center;gap:12px;min-height:60px;margin-bottom:12px;padding-left:0;white-space:nowrap}
.side-brand .logo-circle{width:60px;height:60px;flex:none;border:3px solid var(--blue-light);box-shadow:0 6px 16px rgba(37,99,235,.18)}
.side-brand .logo-circle img,.side-brand .logo-circle svg{width:84%;height:84%}
.side-user{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px 14px;border-radius:20px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(160deg,var(--blue-light),var(--surface-2));border:1px solid var(--border)}
.side-user .avatar{box-shadow:0 0 0 4px var(--surface),0 6px 18px color-mix(in srgb,var(--blue) 30%,transparent)}
.side-user .meta{min-width:0;width:100%;line-height:1.35}
.side-user .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}
.side-user .meta small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-logout{margin-top:10px;color:#fff!important;background:linear-gradient(135deg,#ef4444,#b91c1c)!important;box-shadow:0 6px 16px rgba(220,38,38,.3)}
.nav-logout:hover{filter:brightness(1.06)}
a.navlink{text-decoration:none}
.online{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:#15803d}
.online i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.card-x.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;color:#fff;border:0;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3));background-size:200% 200%;animation:flow 16s ease infinite}
.hero .who{display:flex;gap:16px;align-items:center;min-width:0}
.hero .clock{text-align:right;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:10px 16px;backdrop-filter:blur(8px)}
.hero .clock b{font-size:1.7rem;font-variant-numeric:tabular-nums;letter-spacing:.5px;display:block;line-height:1.35}
.hero .online{color:#bbf7d0;background:rgba(0,0,0,.15);padding:3px 10px;border-radius:999px}
@media (max-width:575.98px){.hero .clock{text-align:left;width:100%}}
.side-brand b{font-size:1.15rem;font-weight:900;color:var(--blue-dark);overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 color-mix(in srgb,var(--blue) 30%,transparent),0 4px 10px color-mix(in srgb,var(--blue) 22%,transparent)}
.side-brand b{overflow:visible!important;padding-top:6px}
.side-brand .plus{font-size:.68em;background:linear-gradient(180deg,var(--c3),var(--blue) 70%,var(--blue-dark));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c3) 70%,transparent))}
.side-brand .plus::before{width:1.5em;height:1.5em}.side-brand .plus::after{width:1.9em;height:1.9em}
[data-theme=dark] .side-brand b{color:#bfdbfe}
.nav-side{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nav-side button{display:flex;align-items:center;gap:14px;min-height:46px;border:0;background:none;border-radius:14px;padding:0 14px;color:var(--muted);font-weight:600;white-space:nowrap;text-align:left;transition:background var(--t),color var(--t)}
.nav-side button i{width:22px;text-align:center;font-size:1.05rem}
.nav-side button:hover{background:var(--surface-2);color:var(--text)}
.nav-side button.active{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.nav-label{font-size:.75rem;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px;letter-spacing:.06em}
.side-toggle{position:fixed;z-index:1050;top:calc(var(--sat) + (var(--head-h) - 40px)/2);left:calc(var(--side-w) - 20px);width:40px;height:40px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.4);transition:left var(--t),transform var(--t)}
.app-main{transition:margin var(--t);min-width:0}
.topbar{position:sticky;top:0;z-index:1030;height:calc(var(--head-h) + var(--sat));padding:var(--sat) calc(16px + var(--sar)) 0 32px;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar .title{font-weight:800;font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-switch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 4px;border:0;min-height:44px;font-weight:600;color:var(--text);font-size:.9rem}
.mode-switch .knob{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;transition:background var(--t)}
.mode-switch.student .knob{background:var(--ok)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--blue-light);color:var(--blue);display:inline-grid;place-items:center;font-weight:800;flex:none}

/** list view: ค้นหา debounce 300ms + Pagination */
function listView(root, { items, headers, row, card, search, filters = '', size = 30, onFilter, emptyText }) {
  root.innerHTML = `<div class="d-flex flex-wrap gap-2 mb-3"><div class="flex-fill" style="min-width:220px"><input class="form-control" type="search" placeholder="ค้นหา..." aria-label="ค้นหา" data-q></div>${filters}</div><div data-t></div><nav class="d-flex justify-content-center gap-2 mt-3 flex-wrap" data-p></nav>`;
  let page = 1;
  const draw = () => {
    const q = $('[data-q]', root).value.trim().toLowerCase();
    let list = items.filter(it => !q || search(it).toLowerCase().includes(q));
    if (onFilter) list = list.filter(it => onFilter(it, root));
    const pages = Math.max(1, Math.ceil(list.length / size)); page = Math.min(page, pages);
    const part = list.slice((page - 1) * size, page * size);
    $('[data-t]', root).innerHTML = (card ? (part.length ? `<div class="grid g3">${part.map(card).join('')}</div>` : empty('fa-inbox', emptyText || 'ยังไม่มีข้อมูล')) : tableHtml(headers, part.map(row))) + `<div class="text-muted small mt-2">ทั้งหมด ${list.length} รายการ</div>`;
    const nums = Array.from({ length: pages }, (_, i) => i + 1).filter(n => n === 1 || n === pages || Math.abs(n - page) <= 2);
    $('[data-p]', root).innerHTML = pages > 1 ? `<button class="btn btn-sm btn-soft" data-pg="${page - 1}" ${page > 1 ? '' : 'disabled'} aria-label="หน้าก่อนหน้า"><i class="fa-solid fa-chevron-left"></i> ก่อนหน้า</button>`
      + nums.map((n, i) => (i && n - nums[i - 1] > 1 ? '<span class="align-self-center px-1">…</span>' : '') + `<button class="btn btn-sm ${n === page ? 'btn-primary' : 'btn-soft'}" data-pg="${n}" style="min-width:44px" aria-label="หน้า ${n}">${n}</button>`).join('')
      + `<button class="btn btn-sm btn-primary" data-pg="${page + 1}" ${page < pages ? '' : 'disabled'} aria-label="หน้าถัดไป">ถัดไป <i class="fa-solid fa-chevron-right"></i></button>` : '';
    $$('[data-pg]', root).forEach(b => b.onclick = () => { page = +b.dataset.pg; draw(); root.scrollIntoView({ behavior: 'smooth' }); });
  };
  $('[data-q]', root).addEventListener('input', debounce(() => { page = 1; draw(); }, 300));
  $$('select[data-f]', root).forEach(s => s.onchange = () => { page = 1; draw(); });
  draw();
  return draw;
}

function hexToHsl(hex) {
  const n = parseInt(String(hex || '#2563eb').slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;

  return [h, s2 * 100, l * 100];
}
function hslToHex(h, s2, l) {

}

  let st = $('#themeVars'); if (!st) { st = document.createElement('style'); st.id = 'themeVars'; document.head.appendChild(st); }
  st.textContent = `:root{--blue:${hex};--blue-dark:${dark};--blue-mid:${mid};--c1:${dark};--c2:${hex};--c3:${acc};--blue-light:${hslToHex(h, Math.min(90, sat), 93)}}
    [data-theme=dark]{--blue-light:${hslToHex(h, Math.min(45, sat), 20)}}`;
}

function makeBokeh() {

  const place = b => { const sz = 8 + Math.random() * 46; Object.assign(b.style, { left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', width: sz + 'px', height: sz + 'px' });
    b.style.setProperty('--bk', cols()); b.style.setProperty('--bl', (sz > 34 ? 4 + Math.random() * 4 : 1 + Math.random() * 2).toFixed(1) + 'px'); b.style.setProperty('--o', (.35 + Math.random() * .55).toFixed(2)); };
  for (let i = 0; i < 26; i++) {

    b.style.setProperty('--d', (3 + Math.random() * 5).toFixed(1) + 's'); b.style.animationDelay = (-Math.random() * 8).toFixed(1) + 's';

function startFx() {
  makeBokeh();
  const cv2 = $('#fxNet'); if (!cv2 || FX) return;
  const ctx = cv2.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, pts = [];
  const size = () => { const r = cv2.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv2.width = W * d; cv2.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    pts = Array.from({ length: Math.round(Math.min(70, W * H / 9000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45, r: Math.random() * 1.8 + .6 })); };
  size(); addEventListener('resize', debounce(size, 200));
  const frame = () => {
    if (!$('#authView').classList.contains('hidden')) {
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {

function parseVideo(u) {
  u = String(u || '').trim(); let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/))) return { type: 'youtube', id: m[1] };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { type: 'vimeo', id: m[1] };
  if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/))) return { type: 'drive', id: m[1] };
  if (/^https?:\/\/.+\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)) return { type: 'file', url: u };
  return null;
}
let YTP = null;
const loadYT = () => YTP || (YTP = new Promise((res, rej) => {
  if (window.YT && YT.Player) return res();
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = rej; document.head.appendChild(s);
  setTimeout(() => rej(new Error('yt timeout')), 7000);
}));
function mountVideo(box, url, prog, lessonId) {

  let last = pos, done = prog && prog.videoDone === 'true';
  const save = (p, isDone) => { if (isDone && !done) { done = true; apiQ('saveProgress', lessonId, { videoPos: p, videoDone: true }).then(() => toast('บันทึก: ดูวิดีโอครบแล้ว')); } else if (Math.abs(p - last) >= 5) { last = p; apiQ('saveProgress', lessonId, { videoPos: p }).catch(() => {}); } };
  const speedSel = `<select class="form-select form-select-sm w-auto" id="vSpeed" aria-label="ความเร็ว">${[0.5, 0.75, 1, 1.25, 1.5, 2].map(s => `<option value="${s}" ${s === 1 ? 'selected' : ''}>${s}x</option>`).join('')}</select>`;
  const tools = (manual) => `<div class="d-flex flex-wrap gap-2 align-items-center mt-2">${manual ? '' : `<label class="small text-muted" for="vSpeed">ความเร็ว</label>${speedSel}`}
    ${pos > 5 ? `<span class="chip info"><i class="fa-solid fa-clock-rotate-left"></i> เล่นต่อจาก ${Math.floor(pos / 60)}:${String(pos % 60).padStart(2, '0')}</span>` : ''}
    <button class="btn btn-sm btn-soft ms-auto" id="vDone" ${done ? 'disabled' : ''}><i class="fa-solid fa-circle-check"></i> ${done ? 'ดูครบแล้ว' : 'ทำเครื่องหมายว่าดูครบ'}</button></div>`;
  if (v.type === 'youtube') {
    box.innerHTML = `<div class="video"><div id="ytp"></div></div>` + tools(false);
    loadYT().then(() => {
      const pl = new YT.Player('ytp', { videoId: v.id, playerVars: { start: pos, rel: 0, playsinline: 1, modestbranding: 1 }, events: {
        onStateChange: e => { if (e.data === 0) save(Math.floor(pl.getDuration()), true); } } });
      S.timers.push(setInterval(() => { try { if (pl.getPlayerState() === 1) save(Math.floor(pl.getCurrentTime())); } catch (e) {} }, 10000));

/* ---------- ตั้งค่า: สีระบบ (ล้อสี) ---------- */
function drawLook(B, c) {
  const PRESET = ['#2563eb', '#1e40af', '#0891b2', '#0d9488', '#16a34a', '#65a30d', '#ca8a04', '#ea580c', '#dc2626', '#db2777', '#9333ea', '#475569'];
  let hex = c.themeColor || '#2563eb', [h, sa, l] = hexToHsl(hex);
  B.innerHTML = `<h5 class="fw-bold mb-1">สีหลักของระบบ</h5><p class="text-muted small">หมุนเลือกสีบนวงล้อ ปรับความสว่าง แล้วกดบันทึก — สีจะใช้ทั้งหน้าเข้าสู่ระบบ เมนู ปุ่ม ตาราง และกราฟ</p>
    <div class="wheel-wrap"><div class="wheel" id="wheel" role="slider" aria-label="วงล้อเลือกสี" tabindex="0"><div class="knob" id="wKnob"></div></div>
    <div class="flex-fill" style="min-width:240px">
      <label class="form-label" for="wLight">ความสว่าง</label><input type="range" class="form-range mb-3" id="wLight" min="25" max="60" value="${Math.round(Math.min(60, Math.max(25, l)))}">
      <label class="form-label" for="wHex">รหัสสี</label><div class="input-group mb-3" style="max-width:260px"><span class="input-group-text" id="wDot" style="width:48px"></span><input class="form-control" id="wHex" value="${esc(hex)}" maxlength="7"></div>
      <div class="form-label">สีแนะนำ</div><div class="d-flex flex-wrap gap-2 mb-3">${PRESET.map(p => `<button class="swatch" data-sw="${p}" style="background:${p}" aria-label="สี ${p}"></button>`).join('')}</div>
      <div class="d-flex flex-wrap gap-2 mb-3 align-items-center"><span class="btn btn-primary">ตัวอย่างปุ่ม</span><span class="chip info">ตัวอย่างป้าย</span><span class="avatar">ก</span></div>
      <div class="d-flex gap-2"><button class="btn btn-primary" id="wSave"><i class="fa-solid fa-floppy-disk"></i> บันทึกสี</button><button class="btn btn-soft" id="wReset">คืนค่าเริ่มต้น</button></div></div></div>`;
  const wheel = $('#wheel'), knob = $('#wKnob');
  const set = (nh, ns, nl, from) => {
    h = nh; sa = ns; l = nl; hex = hslToHex(h, sa, l);
    const R2 = wheel.clientWidth / 2, rad = (h - 90) * Math.PI / 180, r = sa / 100 * R2;
    knob.style.left = (R2 + Math.cos(rad) * r) + 'px'; knob.style.top = (R2 + Math.sin(rad) * r) + 'px'; knob.style.background = hex;
    $('#wDot').style.background = hex; if (from !== 'hex') $('#wHex').value = hex;
    $$('[data-sw]').forEach(b => b.classList.toggle('on', b.dataset.sw === hex));
    applyColor(hex);
  };
  const pick = e => { const r = wheel.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
    const ang = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360, dist = Math.min(1, Math.hypot(x, y) / (r.width / 2));
    set(Math.round(ang), Math.max(35, Math.round(dist * 100)), l); };
  let drag = false;
  wheel.addEventListener('pointerdown', e => { drag = true; wheel.setPointerCapture(e.pointerId); pick(e); });
  wheel.addEventListener('pointermove', e => drag && pick(e));
  wheel.addEventListener('pointerup', () => drag = false);
  wheel.addEventListener('keydown', e => { if (e.key === 'ArrowRight') set((h + 5) % 360, sa, l); if (e.key === 'ArrowLeft') set((h + 355) % 360, sa, l); });
  $('#wLight').oninput = e => set(h, sa, +e.target.value);
  $('#wHex').oninput = e => { const v = e.target.value.trim(); if (/^#[0-9a-f]{6}$/i.test(v)) { const x = hexToHsl(v); set(x[0], x[1], x[2], 'hex'); } };
  $$('[data-sw]').forEach(b => b.onclick = () => { const x = hexToHsl(b.dataset.sw); $('#wLight').value = Math.round(x[2]); set(x[0], x[1], x[2]); });
  $('#wReset').onclick = () => { const x = hexToHsl('#2563eb'); $('#wLight').value = Math.round(x[2]); set(x[0], x[1], x[2]); };
  $('#wSave').onclick = async () => {
    if (!await confirmBox({ title: 'ยืนยันเปลี่ยนสีระบบ', html: `ใช้สี <b style="color:${hex}">${hex}</b> กับทุกหน้า?` })) return;
    await api('saveSettings', { config: { themeColor: hex } }); c.themeColor = S.config.themeColor = hex; toast('บันทึกสีระบบแล้ว');
  };
  requestAnimationFrame(() => set(h, sa, l));
  S.onLeave.push(() => applyColor(S.config.themeColor));
}

  const draw = () => {
    B.innerHTML = `<h5 class="fw-bold mb-1">เมนูมาตรฐาน</h5><p class="text-muted small">เปิด/ปิดเมนูที่นักเรียนเห็นในแถบด้านซ้ายและแถบล่าง (หน้าหลัก และ โปรไฟล์ ปิดไม่ได้)</p>
      <div class="row g-2 mb-4">${NAV.student.map(n => `<div class="col-sm-6 col-lg-4"><div class="form-check form-switch file-row m-0"><input class="form-check-input ms-0 me-2" type="checkbox" role="switch" id="mn_${n[0]}" data-mn="${n[0]}" ${hidden.includes(n[0]) ? '' : 'checked'} ${['home', 'profile'].includes(n[0]) ? 'disabled' : ''}>
        <label class="form-check-label flex-fill" for="mn_${n[0]}"><i class="fa-solid ${n[2]} me-2 text-primary"></i>${n[1]}</label></div></div>`).join('')}</div>
      <h5 class="fw-bold mb-1">เมนูเพิ่มเติม (ลิงก์เว็บไซต์)</h5><p class="text-muted small">เช่น Google Form, Google Classroom, YouTube, เว็บโรงเรียน — เลือกไอคอนเอง หรือให้ระบบเลือกให้อัตโนมัติจากลิงก์ และเลือกได้ว่าจะ "แสดงในระบบ" หรือ "เปิดแท็บใหม่"</p>
      <div id="cmList" class="d-flex flex-column gap-2">${custom.map((x, i) => `<div class="file-row flex-wrap align-items-center m-0" style="gap:8px">
        <button class="btn btn-soft btn-icon flex-none" data-cicon="${i}" title="เลือกไอคอน" aria-label="เลือกไอคอน"><i class="${esc(menuIcon(x))}"></i></button>
        <input class="form-control" style="flex:1 1 160px" data-cn="${i}" value="${esc(x.name)}" placeholder="ชื่อเมนู" aria-label="ชื่อเมนู">
        <input class="form-control" style="flex:2 1 240px" data-cu="${i}" value="${esc(x.url)}" placeholder="https://..." aria-label="ลิงก์">
        <select class="form-select" style="flex:0 1 170px" data-cm="${i}" aria-label="วิธีเปิด">${opt([['app', 'แสดงในระบบ'], ['tab', 'เปิดแท็บใหม่']], x.mode)}</select>
        <button class="btn btn-icon btn-soft text-danger flex-none" data-cd="${i}" aria-label="ลบเมนู"><i class="fa-solid fa-trash"></i></button></div>`).join('') || '<div class="text-muted small mb-2">ยังไม่มีเมนูเพิ่มเติม</div>'}</div>
      <div class="d-flex flex-wrap gap-2 mt-3 mb-4"><button class="btn btn-soft" id="cmAdd"><i class="fa-solid fa-plus"></i> เพิ่มเมนูลิงก์</button></div>
      <h5 class="fw-bold mb-1">ลำดับเมนู</h5><p class="text-muted small">กดลูกศรเพื่อเรียงลำดับเมนูที่นักเรียนเห็นในแถบด้านซ้ายและแถบล่าง</p>
      <div class="d-flex flex-column gap-2 mb-3" id="ordList">${orderItems().map((it, i, arr) => `<div class="file-row m-0"><span class="ord" style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--blue-light);color:var(--blue);font-weight:800">${i + 1}</span>
        <i class="${esc(it.icon)} text-primary"></i><span class="flex-fill">${esc(it.label)}</span>${it.hidden ? '<span class="chip">ซ่อน</span>' : ''}
        <button class="btn btn-sm btn-icon btn-soft" data-ou="${i}" ${i ? '' : 'disabled'} aria-label="เลื่อนขึ้น"><i class="fa-solid fa-arrow-up"></i></button><button class="btn btn-sm btn-icon btn-soft" data-od="${i}" ${i < arr.length - 1 ? '' : 'disabled'} aria-label="เลื่อนลง"><i class="fa-solid fa-arrow-down"></i></button></div>`).join('')}</div>
      <button class="btn btn-primary" id="cmSave"><i class="fa-solid fa-floppy-disk"></i> บันทึกเมนู</button>`;
    $$('[data-ou],[data-od]', B).forEach(b => b.onclick = () => { read(); const list = orderItems().map(x => x.key), i = +(b.dataset.ou ?? b.dataset.od), j = b.dataset.ou !== undefined ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; order = list; draw(); });
    const read = () => { hidden = $$('[data-mn]', B).filter(x => !x.checked).map(x => x.dataset.mn); custom = custom.map((x, i) => Object.assign(x, { name: $(`[data-cn="${i}"]`, B).value.trim(), url: $(`[data-cu="${i}"]`, B).value.trim(), mode: $(`[data-cm="${i}"]`, B).value })); };
    $('#cmAdd').onclick = () => { read(); custom.push({ name: '', url: '', icon: 'auto', mode: 'app', id: 'm' + Date.now().toString(36) }); draw(); };
    $$('[data-cd]', B).forEach(b => b.onclick = () => { read(); custom.splice(+b.dataset.cd, 1); draw(); });
    $$('[data-cu]', B).forEach(inp => inp.addEventListener('input', () => { const i = +inp.dataset.cu; if (custom[i].icon === 'auto') $(`[data-cicon="${i}"] i`, B).className = autoIcon(inp.value); }));
    $$('[data-cicon]', B).forEach(b => b.onclick = async () => {
      read(); const i = +b.dataset.cicon, cur = custom[i].icon || 'auto';
      let pick = null;
      await Sw.fire({ title: 'เลือกไอคอนเมนู', showConfirmButton: false, showCancelButton: true, cancelButtonText: 'ปิด',
        html: `<div class="icon-grid">${MENU_ICONS.map(([ic, lb]) => `<button type="button" class="${ic === cur ? 'on' : ''}" data-ic="${ic}"><i class="${ic === 'auto' ? autoIcon(custom[i].url) : ic}"></i><small>${lb}</small></button>`).join('')}</div>`,
        didOpen: el => $$('[data-ic]', el).forEach(x => x.onclick = () => { pick = x.dataset.ic; Swal.close(); }) });
      if (pick) { custom[i].icon = pick; draw(); }
    });
    $('#cmSave').onclick = async () => {
      read();
      const bad = custom.find(x => !x.name || !/^https:\/\//.test(x.url));
      if (bad) return toast('เมนูเพิ่มเติมต้องมีชื่อ และลิงก์ขึ้นต้นด้วย https://', 'warning');
      if (!await confirmBox({ title: 'ยืนยันบันทึกเมนูนักเรียน', html: `ซ่อน ${hidden.length} เมนู · เมนูลิงก์ ${custom.length} รายการ` })) return;
      const v = JSON.stringify({ hidden, custom, order: orderItems().map(x => x.key) });
      await api('saveSettings', { config: { studentMenus: v } }); c.studentMenus = S.config.studentMenus = v; toast('บันทึกเมนูแล้ว — นักเรียนจะเห็นเมื่อเปิดหน้าเว็บใหม่');
    };
  };
  draw();
}

/* =========================================================
 * เริ่มต้นระบบ
 * ========================================================= */
async function askApiUrl(msg) {
  const r = await Sw.fire({ title: 'เชื่อมต่อระบบ', icon: 'info', html: (msg ? `<div class="text-danger small mb-2">${esc(msg)}</div>` : '') + 'วาง URL เว็บแอปของ Google Apps Script (ลงท้าย <code>/exec</code>)<br><small class="text-muted">ผู้ดูแลควรใส่ไว้ใน docs/index.html เพื่อให้ทุกคนใช้ได้ทันที</small>',
    input: 'url', inputPlaceholder: 'https://script.google.com/macros/s/.../exec', confirmButtonText: 'เชื่อมต่อ', allowOutsideClick: false,
    inputValidator: v => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(v).trim()) ? null : 'URL ต้องอยู่ในรูปแบบ https://script.google.com/macros/s/.../exec' });
  store.set('cp_api', r.value.trim()); location.reload();
}
(async function init() {
  Loader.show('กำลังเตรียมระบบ...');
  if (!HAS_GAS && !API_URL()) { Loader.hide(); applyBrand(); renderLogin('student'); return askApiUrl(); }
  try {
    const b = await apiQ('bootstrap');
    S.config = b.config; S.classes = b.classes; S.maxMB = b.maxUploadMB; applyBrand();
    const token = store.get('cp_token'), exp = +store.get('cp_exp');
    if (token && (!exp || exp > Date.now())) {
      S.token = token; S.expiresAt = exp;
      try { const me = await apiQ('me'); S.user = me.user; S.config = me.config; S.classes = me.classes; S.maxMB = me.maxUploadMB || S.maxMB; enterApp(); return; } catch (e) { store.del('cp_token'); S.token = null; }
    }
    renderLogin();
  } catch (e) {
    applyBrand(); renderLogin();
    if (!HAS_GAS && !window.CP_API_URL) return askApiUrl(e.message);
    Sw.fire({ icon: 'error', title: 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ', html: esc(e.message) + '<br><small>ตรวจสอบว่าบัญชีที่ Deploy มีสิทธิ์แก้ไข Google Sheet และ Drive ที่กำหนดไว้</small>' });
  } finally { Loader.hide(); }
})();
</script>
