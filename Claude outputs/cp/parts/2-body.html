<body class="auth">
<div id="loader" role="status" aria-live="polite" aria-label="กำลังโหลด">
  <div class="glass">
    <div class="ring"><div class="logo-circle" data-logo></div></div>
    <div class="pct" id="lPct">0%</div>
    <div class="pbar"><i id="lBar"></i></div>
    <div class="lmsg" id="lMsg">กำลังโหลดข้อมูล...</div>
  </div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<!-- ============ หน้าเข้าสู่ระบบ ============ -->
<main id="authView" class="auth-wrap">
  <section class="auth-card">
    <div class="auth-left">
      <div class="brand" id="brand"><div class="logo-circle" data-logo></div><h1 data-school>Classroom PLus</h1></div>
      <div class="welcome" id="welcomeText">ยินดีต้อนรับ สู่ห้องเรียนออนไลน์แห่งอนาคต</div>
    </div>
    <div class="auth-right" id="authRight"></div>
  </section>
</main>

<!-- ============ แอปหลัก ============ -->
<div id="appView" class="hidden">
  <aside class="sidebar" id="sidebar" aria-label="เมนูด้านข้าง">
    <div class="side-brand"><div class="logo-circle" data-logo></div><b data-school>Classroom PLus</b></div>
    <nav class="nav-side" id="sideNav"></nav>
  </aside>
  <button class="side-toggle" id="sideToggle" aria-label="พับ/ขยายเมนู"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="scrim" id="scrim"></div>
  <div class="app-main">
    <header class="topbar">
      <div class="title" id="pageTitle">หน้าหลัก</div>
      <button class="mode-switch hidden" id="modeSwitch" aria-label="สลับโหมด"><span class="knob"><i class="fa-solid fa-chalkboard-user"></i></span><span class="d-none d-sm-inline" id="modeText">โหมดครู</span></button>
      <div class="dropdown">
        <button class="btn btn-icon btn-soft position-relative" data-bs-toggle="dropdown" aria-label="การแจ้งเตือน" id="bellBtn"><i class="fa-solid fa-bell"></i><span class="badge-dot hidden" id="bellDot"></span></button>
        <div class="dropdown-menu dropdown-menu-end" style="width:min(360px,92vw)">
          <div class="d-flex align-items-center px-2 py-1"><b class="flex-fill">การแจ้งเตือน</b><button class="btn btn-sm btn-link" id="readAll">อ่านทั้งหมด</button></div>
          <div class="notif" id="notifList"></div>
        </div>
      </div>
      <div class="dropdown">
        <button class="btn p-0 border-0 d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-label="เมนูโปรไฟล์"><span id="meAvatar"></span><span class="d-none d-md-inline fw-semibold" id="meName"></span></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item" data-go="profile"><i class="fa-solid fa-user"></i>โปรไฟล์ของฉัน</button></li>
          <li><button class="dropdown-item" id="themeBtn"><i class="fa-solid fa-circle-half-stroke"></i>สลับธีมสว่าง/มืด</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>ออกจากระบบ</button></li>
        </ul>
      </div>
    </header>
    <div id="bannerBox"></div>
    <main class="page" id="page"></main>
  </div>
  <nav class="dock" id="dock" aria-label="เมนูหลัก"></nav>
  <button class="fab hidden" id="fab" aria-label="เพิ่มรายการ"><i class="fa-solid fa-plus"></i></button>
</div>

<footer>© 2026 Classroom PLus | KruPond (Mr.Nattawut Nukong)</footer>

<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header border-0"><h5 class="modal-title fw-bold" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer border-0" id="modalFoot"></div>
    </div>
  </div>
</div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/th.js"></script>
