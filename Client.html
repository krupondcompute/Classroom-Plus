<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), view=$('#view'), nav=$('#nav'), TOKEN='cp_session', GAS_KEY='cp_gas_url';let user=null, bridgeFrame=null, bridgeOrigin='', bridgeReady=null, bridgeWait=null, data={courses:[],classes:[],assignments:[],announcements:[],lessons:[],submissions:[]};
const menus=[['home','ภาพรวม','fa-house'],['classes','ห้องเรียน','fa-users'],['students','นักเรียน','fa-user-graduate'],['courses','วิชาเรียน','fa-book-open'],['lessons','บทเรียน','fa-lightbulb'],['announcements','ประกาศ','fa-bullhorn'],['assignments','งานที่มอบหมาย','fa-list-check'],['submissions','การส่งงาน','fa-inbox'],['account','บัญชีของฉัน','fa-user-gear']];
function validGasUrl(raw){try{const u=new URL(raw);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec\/?$/.test(u.pathname)?u.href.replace(/\/$/,''):'';}catch(_){return '';}}
function setupBridge(){const url=validGasUrl(localStorage.getItem(GAS_KEY)||'');if(!url)return Promise.reject(new Error('ยังไม่ได้ตั้งค่า Apps Script Web App URL'));if(bridgeReady)return bridgeReady;bridgeReady=new Promise((resolve,reject)=>{bridgeWait={resolve,reject,timer:setTimeout(()=>{bridgeReady=null;reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ ตรวจ URL และการ Deploy Web App'))},15000)};bridgeFrame=document.createElement('iframe');bridgeFrame.title='เชื่อมต่อ Classroom Plus';bridgeFrame.setAttribute('aria-hidden','true');bridgeFrame.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;bottom:-10px';bridgeFrame.src=url+'?mode=bridge';bridgeFrame.onload=()=>bridgeFrame.contentWindow.postMessage({type:'cp-hello',nonce:crypto.randomUUID()},'*');document.body.appendChild(bridgeFrame);});return bridgeReady;}
window.addEventListener('message',e=>{if(!bridgeFrame||e.source!==bridgeFrame.contentWindow)return;if(!['https://script.google.com','https://script.googleusercontent.com'].includes(e.origin))return;const m=e.data||{};if(m.type==='cp-bridge-loaded'){bridgeFrame.contentWindow.postMessage({type:'cp-hello',nonce:crypto.randomUUID()},e.origin);return;}if(m.type==='cp-ready'&&bridgeWait){bridgeOrigin=e.origin;clearTimeout(bridgeWait.timer);bridgeWait.resolve(true);bridgeWait=null;return;}if(m.type==='cp-response'){const p=pending.get(m.id);if(p){pending.delete(m.id);m.ok?p.resolve(m.result):p.reject(new Error(m.error||'เกิดข้อผิดพลาด'));}}});
const pending=new Map();
const activeActions=new Set();let busyCount=0;
async function call(action,p={}){if(activeActions.has(action))throw new Error('กำลังดำเนินการอยู่ กรุณารอสักครู่');activeActions.add(action);busyCount++;document.documentElement.dataset.busy='true';const payload={...p,token:sessionStorage.getItem(TOKEN)||''};try{if(typeof google!=='undefined'&&google.script&&google.script.run)return await new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error((e&&e.message||'เกิดข้อผิดพลาด').replace(/^Exception:\s*/,'')))).api(action,payload);});await setupBridge();return await new Promise((resolve,reject)=>{const id=crypto.randomUUID();pending.set(id,{resolve,reject});bridgeFrame.contentWindow.postMessage({type:'cp-request',id,action,payload},bridgeOrigin);setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('เซิร์ฟเวอร์ใช้เวลานาน กรุณาลองใหม่'));}},30000);});}finally{activeActions.delete(action);busyCount--;if(!busyCount)delete document.documentElement.dataset.busy;}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s,type='success'){const n=$('#notice');n.textContent=s;n.className='notice '+type;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.add('d-none'),3500);}
async function load(){const [d,c,cl,a,an,l,s]=await Promise.all([call('dashboard'),call('listCourses'),call('listClasses'),call('listAssignments'),call('listAnnouncements'),call('listLessons'),call('listSubmissions')]);user=d.user;data={courses:c,classes:cl,assignments:a,announcements:an,lessons:l,submissions:s,dashboard:d,students:user.role==='student'?[]:await call('listStudents')};}
function authScreen(mode='login'){const signup=mode==='signup';$('#sidebar').classList.add('d-none');$('#logoutBtn').classList.add('d-none');view.innerHTML=`<div class="auth-wrap"><div class="cardx auth-card"><div class="brand auth-brand"><span class="brand-mark"><i class="fa-solid fa-book-open-reader"></i></span><span>Classroom<span class="brand-plus"> Plus</span></span></div><span class="eyebrow">พื้นที่การเรียนรู้</span><h1>${signup?'สร้างบัญชีนักเรียน':'ยินดีต้อนรับกลับ'}</h1><p class="subtle mb-4">${signup?'สมัครเพื่อเริ่มต้นการเรียนรู้':'เข้าสู่ระบบเพื่อไปยังห้องเรียนของคุณ'}</p><form id="authForm">${signup?'<div class="mb-3"><label class="form-label">ชื่อที่แสดง</label><input class="form-control" name="displayName" required maxlength="100"></div><div class="mb-3"><label class="form-label">รหัสนักเรียน 5 หลัก</label><input class="form-control" name="studentCode" inputmode="numeric" pattern="[0-9]{5}" required></div><div class="mb-3"><label class="form-label">รหัสเข้าห้องจากครู</label><input class="form-control" name="joinCode" maxlength="8" autocomplete="off"></div>':''}<div class="mb-3"><label class="form-label">${signup?'ชื่อบัญชี (4–30 ตัวอักษร)':'ชื่อบัญชี หรือรหัสนักเรียน'}</label><input class="form-control" name="username" autocomplete="username" required></div><div class="mb-3"><label class="form-label">รหัสผ่าน${signup?' (อย่างน้อย 10 ตัว)':''}</label><input class="form-control" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required ${signup?'minlength="10"':''}></div>${signup?'<label class="d-flex gap-2 small mb-3"><input type="checkbox" required> ยินยอมให้ใช้ข้อมูลเพื่อจัดการการเรียนรู้</label>':''}<button class="btn btn-primary w-100" type="submit">${signup?'สมัครบัญชี':'เข้าสู่ระบบ'}</button></form><p class="text-center mt-4 mb-0 subtle">${signup?'มีบัญชีแล้ว?':'ยังไม่มีบัญชี?'} <span class="switch-auth" data-mode="${signup?'login':'signup'}">${signup?'เข้าสู่ระบบ':'สมัครนักเรียน'}</span></p><p class="small subtle mt-3 mb-0">การสมัครครูทำโดยผู้ดูแลระบบเท่านั้น</p></div></div>`;$('#authForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{if(signup){const r=await call('register',f);toast(r.pending?'สมัครแล้ว รอครูอนุมัติ':'สมัครสำเร็จ กรุณาเข้าสู่ระบบ');authScreen('login');}else{const r=await call('login',f);sessionStorage.setItem(TOKEN,r.token);await start();}}catch(err){toast(err.message,'error');}};$('.switch-auth').onclick=e=>authScreen(e.target.dataset.mode);}
function enhanceSignupWizard(){const form=$('#authForm');if(!form)return;const nodes=Array.from(form.children),basic=nodes.slice(0,3),account=nodes.slice(3,5),consent=nodes[5],submit=nodes[6];if(!submit)return;const progress=document.createElement('div');progress.className='wizard-progress subtle small mb-3';progress.setAttribute('aria-live','polite');const makePanel=(n,contents)=>{const p=document.createElement('section');p.className='wizard-panel';p.dataset.wizard=n;contents.forEach(x=>p.append(x));return p};const addNav=(panel,back,next)=>{const row=document.createElement('div');row.className='d-flex gap-2 mt-3';if(back){const b=document.createElement('button');b.type='button';b.className='btn btn-light flex-fill';b.textContent='ย้อนกลับ';b.dataset.wizBack=back;row.append(b)}if(next){const b=document.createElement('button');b.type='button';b.className='btn btn-primary flex-fill';b.textContent='ต่อไป';b.dataset.wizNext=next;row.append(b)}panel.append(row)};const p1=makePanel(1,basic),p2=makePanel(2,account),p3=makePanel(3,[consent,submit]);addNav(p1,null,2);addNav(p2,1,3);addNav(p3,2,null);form.replaceChildren(progress,p1,p2,p3);const show=n=>{form.querySelectorAll('.wizard-panel').forEach(x=>x.hidden=Number(x.dataset.wizard)!==n);progress.textContent=`ขั้นตอน ${n} จาก 3 · ${['ข้อมูลนักเรียนและห้อง','ตั้งค่าบัญชี','ยืนยันข้อมูลและยินยอม'][n-1]}`;if(n===3){const f=form.elements;let summary=form.querySelector('.review-summary');if(!summary){summary=document.createElement('p');summary.className='review-summary small subtle mb-3';consent.before(summary)}summary.textContent=`${f.displayName.value} · รหัส ${f.studentCode.value} · ห้องรหัส ${f.joinCode.value.toUpperCase()} · บัญชี ${f.username.value}`;}};form.querySelectorAll('[data-wiz-next]').forEach(b=>b.onclick=()=>{const current=form.querySelector(`[data-wizard="${b.closest('.wizard-panel').dataset.wizard}"]`);const invalid=Array.from(current.querySelectorAll('input')).find(x=>!x.checkValidity());if(invalid){invalid.reportValidity();return}if(b.dataset.wizNext==='3'&&form.elements.password.value!==form.elements.passwordConfirm.value){toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน','error');return}show(Number(b.dataset.wizNext))});form.querySelectorAll('[data-wiz-back]').forEach(b=>b.onclick=()=>show(Number(b.dataset.wizBack)));const pass=form.elements.password;pass.pattern='.{10,}';pass.title='ใช้รหัสผ่านอย่างน้อย 10 ตัว';const confirm=document.createElement('div');confirm.className='mb-3';confirm.innerHTML='<label class="form-label" for="passwordConfirm">ยืนยันรหัสผ่าน</label><input class="form-control" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="10">';form.querySelector('[name="password"]').closest('.mb-3').after(confirm);const username=form.elements.username;username.pattern='[a-zA-Z0-9._-]{4,30}';username.title='ใช้ a-z, 0-9, จุด ขีดกลาง หรือขีดล่าง 4–30 ตัว';show(1);}
const originalAuthScreen=authScreen;authScreen=function(mode='login'){originalAuthScreen(mode);if(mode==='signup'){enhanceSignupWizard();const form=$('#authForm');if(form){form.elements.joinCode.required=true;form.elements.joinCode.pattern='[A-Za-z0-9]{8}';form.elements.joinCode.title='กรอกรหัสเข้าห้อง 8 ตัวจากครู';}}};
function setupScreen(){const saved=localStorage.getItem(GAS_KEY)||'';$('#sidebar').classList.add('d-none');$('#logoutBtn').classList.add('d-none');view.innerHTML=`<div class="auth-wrap"><div class="cardx auth-card"><div class="brand auth-brand"><span class="brand-mark"><i class="fa-solid fa-book-open-reader"></i></span><span>Classroom<span class="brand-plus"> Plus</span></span></div><span class="eyebrow">เชื่อมต่อห้องเรียน</span><h1>ตั้งค่า Apps Script</h1><p class="subtle mb-4">Pages ให้บริการหน้าเว็บ ส่วนข้อมูลและบัญชีจะทำงานผ่าน Google Apps Script Web App ของโรงเรียน</p><form id="setupForm"><div class="mb-3"><label class="form-label" for="gasUrl">Web App URL</label><input class="form-control" id="gasUrl" name="gasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(saved)}" required></div><p class="small subtle">ตั้งค่าและ Deploy Apps Script ก่อน ดูขั้นตอนใน <a href="https://github.com/krupondcompute/Classroom-Plus/blob/main/README.md" target="_blank" rel="noopener">คู่มือติดตั้ง</a></p><button class="btn btn-primary w-100">เชื่อมต่อและเปิดแอป</button></form></div></div>`;$('#setupForm').onsubmit=e=>{e.preventDefault();const v=validGasUrl(new FormData(e.target).get('gasUrl'));if(!v){toast('กรุณาใช้ URL Apps Script Web App รูปแบบ /macros/s/.../exec','error');return;}localStorage.setItem(GAS_KEY,v);bridgeReady=null;location.reload();};}
async function start(){try{await load();$('#sidebar').classList.remove('d-none');$('#logoutBtn').classList.remove('d-none');$('#profile').innerHTML=`<div class="avatar">${esc((user.displayName||'?').slice(0,1))}</div><div><div class="profile-name">${esc(user.displayName)}</div><div class="profile-role">${user.role==='student'?'นักเรียน':'ครู'}</div></div>`;nav.innerHTML=menus.filter(([id])=>user.role!=='student'||!['classes','students'].includes(id)).map(([id,label,icon])=>`<a href="#${id}" data-page="${id}" class="nav-item"><i class="fa-solid ${icon}"></i>${label}</a>`).join('');const requested=location.hash.slice(1)||'home';render(user.role==='student'&&['classes','students'].includes(requested)?'home':requested);}catch(e){sessionStorage.removeItem(TOKEN);authScreen();if(e.message!=='กรุณาเข้าสู่ระบบ')toast(e.message,'error');}}
function empty(msg){return `<div class="empty"><i class="fa-regular fa-folder-open"></i>${esc(msg)}</div>`;}
function title(kicker,title,sub,button=''){return `<div class="welcome"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="subtle">${sub}</div></div>${button}</div>`;}
function stat(icon,n,label){return `<div class="cardx stat"><span class="stat-icon"><i class="fa-solid ${icon}"></i></span><span><strong>${n}</strong><small>${label}</small></span></div>`;}
function render(page){if(!user){authScreen();return}const teacher=user.role!=='student';nav.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active',a.dataset.page===page));$('#crumb').textContent=(menus.find(x=>x[0]===page)||menus[0])[1];let html='';
if(page==='home'){let d=data.dashboard;html=title('สวัสดี, '+esc(user.displayName),'วันนี้มาเรียนรู้อะไรกันดี?','รวมสิ่งสำคัญในห้องเรียนของคุณ')+`<div class="stat-grid">${stat('fa-book',d.courses,'วิชาที่เรียน')}${stat('fa-clipboard-list',d.assignments,'งานทั้งหมด')}${stat('fa-inbox',teacher?d.pendingReview:data.submissions.length,teacher?'งานรอตรวจ':'งานที่ส่งแล้ว')}${stat('fa-bullhorn',data.announcements.length,'ประกาศ')}</div><div class="section-head"><h2>วิชาเรียน</h2><a class="btn-soft" href="#courses">ดูทั้งหมด</a></div>${courseGrid(data.courses.slice(0,3))}<div class="section-head"><h2>ประกาศล่าสุด</h2><a class="btn-soft" href="#announcements">ดูทั้งหมด</a></div>${announcementList(data.announcements.slice(0,3))}`;}
else if(page==='courses'){html=title('ห้องเรียน','วิชาเรียน','วิชาและห้องเรียนของคุณ',teacher?'<button class="btn btn-primary" data-action="course"><i class="fa-solid fa-plus me-2"></i>เพิ่มวิชา</button>':'')+courseGrid(data.courses);}
else if(page==='classes'){html=title('จัดชั้นเรียน','ห้องเรียน','สร้างห้องและแชร์รหัสให้ผู้เรียนสมัครเข้าห้อง',teacher?'<button class="btn btn-primary" data-action="class"><i class="fa-solid fa-plus me-2"></i>สร้างห้อง</button>':'')+classGrid(data.classes);}
else if(page==='students'){html=title('จัดการผู้เรียน','นักเรียน','บัญชีที่สมัครด้วยรหัสเข้าห้องของคุณ')+studentList(data.students);}
else if(page==='account'){html=title('การตั้งค่าบัญชี','บัญชีของฉัน','แก้ไขชื่อและเปลี่ยนรหัสผ่าน')+`<div class="cardx mb-3"><h2 class="fs-5 fw-bold">ข้อมูลโปรไฟล์</h2><form id="profileForm"><div class="mb-3"><label class="form-label">ชื่อที่แสดง</label><input class="form-control" name="displayName" value="${esc(user.displayName)}" required maxlength="100"></div><div class="mb-3"><label class="form-label">อีเมล (ไม่บังคับ)</label><input class="form-control" type="email" name="email" value="${esc(user.email||'')}"></div><button class="btn btn-primary">บันทึกโปรไฟล์</button></form></div><div class="cardx"><h2 class="fs-5 fw-bold">เปลี่ยนรหัสผ่าน</h2><form id="passwordForm"><div class="mb-3"><label class="form-label">รหัสผ่านปัจจุบัน</label><input class="form-control" name="oldPassword" type="password" required autocomplete="current-password"></div><div class="mb-3"><label class="form-label">รหัสผ่านใหม่ (อย่างน้อย 10 ตัว)</label><input class="form-control" name="newPassword" type="password" required minlength="10" autocomplete="new-password"></div><button class="btn btn-primary">เปลี่ยนรหัสผ่าน</button></form></div>`;}
else if(page==='lessons'){html=title('เนื้อหาการเรียน','บทเรียน','เนื้อหาและสื่อประกอบการเรียน',teacher?'<button class="btn btn-primary" data-action="lesson"><i class="fa-solid fa-plus me-2"></i>เพิ่มบทเรียน</button>':'')+`<div class="cardx">${data.lessons.length?data.lessons.map(x=>`<div class="list-row"><div><h3>${esc(x.title)}</h3><p>${esc(data.courses.find(c=>c.id===x.courseId)?.name||'')} · ${esc(x.content)}</p>${x.mediaUrl?`<a href="${esc(x.mediaUrl)}" target="_blank" rel="noopener">เปิดสื่อประกอบ <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`:''}</div></div>`).join(''):empty('ยังไม่มีบทเรียน')}</div>`;}
else if(page==='announcements'){html=title('ข่าวสาร','ประกาศ','อัปเดตจากห้องเรียน',teacher?'<button class="btn btn-primary" data-action="announcement"><i class="fa-solid fa-plus me-2"></i>เขียนประกาศ</button>':'')+announcementList(data.announcements);}
else if(page==='assignments'){html=title('ฝึกฝนและส่งงาน','งานที่มอบหมาย','ตรวจงานที่ต้องทำและวันกำหนดส่ง',teacher?'<button class="btn btn-primary" data-action="assignment"><i class="fa-solid fa-plus me-2"></i>มอบหมายงาน</button>':'')+assignmentList();}
else if(page==='submissions'){html=title('ติดตามงาน','การส่งงาน',teacher?'ตรวจคำตอบและให้ข้อเสนอแนะ':'ดูสถานะและคะแนนของงานที่ส่ง')+submissionList(teacher);}
view.innerHTML=html;view.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openForm(b.dataset.action));}
function courseGrid(items){return items.length?`<div class="grid-cards">${items.map(c=>`<article class="cardx course-card"><span class="course-tag">${esc(c.className||'ห้องเรียน')}</span><h3>${esc(c.name)}</h3><p>${esc(c.description||'เรียนรู้และเติบโตไปด้วยกัน')}</p></article>`).join('')}</div>`:empty('ยังไม่มีวิชาเรียน');}
function classGrid(items){return items.length?`<div class="grid-cards">${items.map(c=>`<article class="cardx"><span class="course-tag">${esc(c.grade||'ห้องเรียน')}</span><h3 class="fs-5 fw-bold">${esc(c.name)}</h3><p class="subtle mb-2">รหัสเข้าห้อง</p><button class="btn-soft" data-copy="${esc(c.joinCode||'')}"><i class="fa-regular fa-copy me-2"></i>${esc(c.joinCode||'—')}</button></article>`).join('')}</div>`:empty('ยังไม่มีห้องเรียน สร้างห้องแล้วแชร์รหัสให้นักเรียน');}
function studentList(items){return items.length?`<div class="cardx">${items.map(s=>`<article class="list-row"><div><h3>${esc(s.displayName)} <span class="pill">${esc(s.studentCode)}</span></h3><p>${esc(data.classes.find(c=>c.id===s.classId)?.name||'')} · ${esc(s.username)}</p></div><div class="d-flex gap-2 align-items-center"><span class="pill ${s.status==='active'?'good':''}">${s.status==='active'?'ใช้งานได้':s.status==='pending'?'รออนุมัติ':'ระงับ'}</span>${s.status==='pending'?`<button class="btn-soft" data-student="${esc(s.id)}" data-status="active">อนุมัติ</button>`:s.status==='active'?`<button class="btn-soft" data-student="${esc(s.id)}" data-status="suspended">ระงับ</button>`:`<button class="btn-soft" data-student="${esc(s.id)}" data-status="active">เปิดใช้</button>`}</div></article>`).join('')}</div>`:empty('ยังไม่มีนักเรียนในห้องของคุณ');}
function announcementList(items){return items.length?`<div class="cardx">${items.map(a=>`<article class="list-row announcement"><div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></div><span class="pill">${fmt(a.createdAt)}</span></article>`).join('')}</div>`:empty('ยังไม่มีประกาศ');}
function assignmentList(){return data.assignments.length?`<div class="cardx">${data.assignments.map(a=>{const mine=data.submissions.find(s=>s.assignmentId===a.id);return `<article class="list-row"><div><h3>${esc(a.title)}</h3><p>${esc(a.description)} · ${esc(data.courses.find(c=>c.id===a.courseId)?.name||'')}</p><p>กำหนดส่ง ${fmt(a.dueAt)} · ${a.maxPoints} คะแนน</p></div>${user.role==='student'?`<button class="btn-soft" data-submit="${esc(a.id)}">${mine?'แก้ไขคำตอบ':'ส่งงาน'}</button>`:''}</article>`}).join('')}</div>`:empty('ยังไม่มีงานที่มอบหมาย');}
function submissionList(teacher){return data.submissions.length?`<div class="cardx">${data.submissions.map(s=>{const a=data.assignments.find(x=>x.id===s.assignmentId)||{};return `<article class="list-row"><div><h3>${esc(a.title||'งาน')} · ${esc(s.studentName||user.displayName)}</h3><p>${esc(s.text)} ${s.fileUrl?`<a href="${esc(s.fileUrl)}" target="_blank" rel="noopener">เปิดไฟล์/ลิงก์</a>`:''}</p><p>${s.grade?`คะแนน ${s.grade.points}/${a.maxPoints} · ${esc(s.grade.feedback)}`:'รอตรวจ'}</p></div>${teacher?`<button class="btn-soft" data-grade="${esc(s.id)}">ให้คะแนน</button>`:`<span class="pill ${s.grade?'good':''}">${s.grade?'ตรวจแล้ว':'ส่งแล้ว'}</span>`}</article>`}).join('')}</div>`:empty('ยังไม่มีการส่งงาน');}
function fmt(v){if(!v)return 'ไม่ระบุ';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});}
function openForm(kind,id=''){const labels={class:'สร้างห้องเรียน',course:'เพิ่มวิชา',lesson:'เพิ่มบทเรียน',announcement:'เขียนประกาศ',assignment:'มอบหมายงาน'};let fields='';if(kind==='class')fields=`${input('name','ชื่อห้องเรียน')} ${input('grade','ระดับชั้น/กลุ่ม')}`;if(kind==='course')fields=`${select('classId','ห้องเรียน',data.classes,'name')} ${input('name','ชื่อวิชา')} ${area('description','รายละเอียด')}`;if(kind==='lesson')fields=`${select('courseId','วิชา',data.courses,'name')} ${input('title','ชื่อบทเรียน')} ${area('content','เนื้อหา')} ${input('mediaUrl','ลิงก์สื่อ (ถ้ามี)','url')}`;if(kind==='announcement')fields=`${select('classId','ห้องเรียน (ไม่เลือกเพื่อประกาศทั่วไป)',data.classes,'name',true)} ${input('title','หัวข้อ')} ${area('body','ข้อความประกาศ')}`;if(kind==='assignment')fields=`${select('courseId','วิชา',data.courses,'name')} ${input('title','ชื่องาน')} ${area('description','รายละเอียด')} ${input('dueAt','กำหนดส่ง','datetime-local')} ${input('maxPoints','คะแนนเต็ม','number','100')}`;$('#modalRoot').innerHTML=`<div class="modal fade" id="formModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">${labels[kind]}</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button></div><form id="itemForm"><div class="modal-body">${fields}</div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary">บันทึก</button></div></form></div></div></div>`;const modal=new bootstrap.Modal($('#formModal'));modal.show();$('#itemForm').onsubmit=async e=>{e.preventDefault();try{let p=Object.fromEntries(new FormData(e.target));p.maxPoints=Number(p.maxPoints||100);await call(({class:'saveClass',course:'saveCourse',lesson:'saveLesson',announcement:'saveAnnouncement',assignment:'saveAssignment'})[kind],p);modal.hide();await load();render(location.hash.slice(1)||'home');toast('บันทึกเรียบร้อย');}catch(err){toast(err.message,'error');}};}
function input(n,l,t='text',v=''){return `<div class="mb-3"><label class="form-label">${l}</label><input class="form-control" name="${n}" type="${t}" value="${v}" ${n==='name'||n==='title'?'required':''}></div>`}function area(n,l){return `<div class="mb-3"><label class="form-label">${l}</label><textarea class="form-control" name="${n}" rows="3"></textarea></div>`}function select(n,l,items,key,optional=false){return `<div class="mb-3"><label class="form-label">${l}</label><select name="${n}" class="form-select" ${optional?'':'required'}>${optional?'<option value="">ทุกห้อง</option>':''}${items.map(x=>`<option value="${esc(x.id)}">${esc(x[key])}</option>`).join('')}</select></div>`}
document.addEventListener('click',async e=>{const navlink=e.target.closest('[data-page]');if(navlink){e.preventDefault();location.hash=navlink.dataset.page;$('#sidebar').classList.remove('open');$('.mobile-overlay')?.classList.remove('show');return}const copier=e.target.closest('[data-copy]');if(copier){try{await navigator.clipboard.writeText(copier.dataset.copy);toast('คัดลอกรหัสเข้าห้องแล้ว');}catch(_){toast('คัดลอกไม่ได้ กรุณาจดรหัส: '+copier.dataset.copy,'error')}return}const student=e.target.closest('[data-student]');if(student){try{await call('setStudentStatus',{studentId:student.dataset.student,status:student.dataset.status});await load();render('students');toast('อัปเดตสถานะนักเรียนแล้ว');}catch(err){toast(err.message,'error')}return}const submit=e.target.closest('[data-submit]');if(submit){const a=data.assignments.find(x=>x.id===submit.dataset.submit);$('#modalRoot').innerHTML=`<div class="modal fade" id="submitModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="submitForm"><div class="modal-header"><h2 class="modal-title fs-5">ส่งงาน: ${esc(a.title)}</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">${area('text','คำตอบ/รายละเอียด')} ${input('fileUrl','URL ไฟล์ใน Drive','url')}</div><div class="modal-footer"><button class="btn btn-primary">ส่งงาน</button></div></form></div></div></div>`;let m=new bootstrap.Modal($('#submitModal'));m.show();$('#submitForm').onsubmit=async ev=>{ev.preventDefault();try{await call('submitAssignment',{assignmentId:a.id,...Object.fromEntries(new FormData(ev.target))});m.hide();await load();render('assignments');toast('ส่งงานแล้ว');}catch(err){toast(err.message,'error')}};return}const grade=e.target.closest('[data-grade]');if(grade){const s=data.submissions.find(x=>x.id===grade.dataset.grade),a=data.assignments.find(x=>x.id===s.assignmentId);const points=prompt(`คะแนนเต็ม ${a.maxPoints}`,s.grade?.points||'');if(points===null)return;const feedback=prompt('ข้อเสนอแนะ',s.grade?.feedback||'')||'';try{await call('gradeSubmission',{submissionId:s.id,points:Number(points),feedback});await load();render('submissions');toast('บันทึกคะแนนแล้ว')}catch(err){toast(err.message,'error')}}});
document.addEventListener('submit',async e=>{if(e.target.id==='profileForm'){e.preventDefault();try{const r=await call('updateProfile',Object.fromEntries(new FormData(e.target)));user=r.user;$('#profile .profile-name').textContent=user.displayName;toast('บันทึกโปรไฟล์แล้ว');}catch(err){toast(err.message,'error');}}if(e.target.id==='passwordForm'){e.preventDefault();try{await call('changePassword',Object.fromEntries(new FormData(e.target)));sessionStorage.removeItem(TOKEN);toast('เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบใหม่');authScreen();}catch(err){toast(err.message,'error');}}});
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'home'));$('#logoutBtn').onclick=async()=>{try{await call('logout')}catch(_){}sessionStorage.removeItem(TOKEN);user=null;authScreen()};$('#menuToggle').onclick=()=>{$('#sidebar').classList.toggle('open');let o=$('.mobile-overlay');if(!o){o=document.createElement('div');o.className='mobile-overlay';document.body.append(o);o.onclick=()=>{$('#sidebar').classList.remove('open');o.classList.remove('show')}}o.classList.toggle('show')};
const hostedInAppsScript=typeof google!=='undefined'&&google.script&&google.script.run;
if(!hostedInAppsScript&&!validGasUrl(localStorage.getItem(GAS_KEY)||''))setupScreen();else if(hostedInAppsScript){if(sessionStorage.getItem(TOKEN))start();else authScreen();}else setupBridge().then(()=>{if(sessionStorage.getItem(TOKEN))start();else authScreen();}).catch(e=>{setupScreen();toast(e.message,'error');});
})();
</script>
